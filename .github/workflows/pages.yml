# Publishes ONLY the static site in site/ to GitHub Pages. It is intentionally separate from releases:
# it never builds, uploads or publishes an app package, and it has no release/tag trigger.
name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check site (no JS, no empty links, no personal paths)
        run: |
          ! grep -rEl '<script' site || { echo "script tag found"; exit 1; }
          ! grep -rE 'href=""' site || { echo "empty href"; exit 1; }
          ! grep -rEI '/Users/|/Volumes/' site || { echo "personal path in site"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
