# Publishes ONLY the static site in site/ to GitHub Pages. It is intentionally separate from releases:
# it never builds, uploads or publishes an app package, and it has no release/tag trigger.
name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  # Two jobs on purpose: deploy-pages lists the run's artifacts through the REST API. When upload and deploy share one job, the
  # listing runs within a second of the upload and can return 0 artifacts (observed, docs/PAGES_DIAGNOSIS.md). A separate job
  # starts on a new runner after the upload job has finished, and "Re-run failed jobs" re-runs only the deploy job (no duplicate artifact).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check site (no JS, no empty links, no personal paths)
        run: |
          ! grep -rEl '<script' site || { echo "script tag found"; exit 1; }
          ! grep -rE 'href=""' site || { echo "empty href"; exit 1; }
          ! grep -rEI '/Users/|/Volumes/' site || { echo "personal path in site"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
# Diagnosis and results: docs/PAGES_DIAGNOSIS.md
